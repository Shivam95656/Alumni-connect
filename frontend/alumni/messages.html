<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Messages - Alumni Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: var(--font-sans, 'Plus Jakarta Sans', sans-serif); 
      background: #f8fafc; 
      color: #0f172a; 
      min-height: 100vh;
    }

    .top-nav {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: #0f172a;
      font-weight: 700;
      font-size: 1rem;
    }

    .chat-layout-wrapper {
      max-width: 1380px;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
      height: calc(100vh - 120px);
    }

    .chat-canvas {
      display: grid;
      grid-template-columns: 340px 1fr;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      height: 100%;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    /* Left Sidebar: Conversations */
    .threads-sidebar {
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      background: #fafbfd;
    }

    .threads-header {
      padding: 1.25rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .threads-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .search-box-wrap {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid #f1f5f9;
    }

    .search-input {
      width: 100%;
      padding: 0.55rem 0.85rem;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: inherit;
      background: #ffffff;
      color: #0f172a;
    }

    .search-input:focus {
      outline: none;
      border-color: #2563eb;
    }

    .threads-list {
      flex: 1;
      overflow-y: auto;
    }

    .thread-item {
      padding: 0.95rem 1.25rem;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      display: flex;
      gap: 0.85rem;
      align-items: center;
      transition: background 0.15s ease;
    }

    .thread-item:hover {
      background: #f1f5f9;
    }

    .thread-item.active {
      background: #ffffff;
      border-left: 3px solid #0f172a;
    }

    .thread-avatar {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .thread-info {
      flex: 1;
      min-width: 0;
    }

    .thread-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: #0f172a;
      margin-bottom: 0.15rem;
    }

    .thread-preview {
      font-size: 0.8rem;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thread-time {
      font-size: 0.725rem;
      color: #94a3b8;
    }

    /* Right Chat Main */
    .conversation-panel {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      height: 100%;
    }

    .empty-chat-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .chat-active-view {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .chat-top-bar {
      padding: 1rem 1.75rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-user-meta {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .chat-user-avatar {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .chat-user-name {
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
    }

    .chat-user-dept {
      font-size: 0.8rem;
      color: #64748b;
    }

    .messages-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      background: #fafbfd;
    }

    .msg-row {
      display: flex;
      max-width: 68%;
    }

    .msg-row.sent {
      align-self: flex-end;
      justify-content: flex-end;
    }

    .msg-row.received {
      align-self: flex-start;
      justify-content: flex-start;
    }

    .bubble {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-row.sent .bubble {
      background: #0f172a;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .msg-row.received .bubble {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 2px;
    }

    .msg-stamp {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 0.25rem;
      padding: 0 0.2rem;
    }

    .msg-row.sent .msg-stamp {
      text-align: right;
    }

    .message-compose-bar {
      padding: 1.25rem 1.75rem;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      background: #ffffff;
    }

    .compose-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.925rem;
      color: #0f172a;
      resize: none;
      max-height: 100px;
    }

    .compose-input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    @media (max-width: 850px) {
      .chat-canvas { grid-template-columns: 1fr; }
      .threads-sidebar { display: none; }
      .threads-sidebar.mobile-open { display: flex; position: absolute; inset: 0; z-index: 100; }
    }
  </style>
</head>
<body>
  <!-- Top Navigation -->
  <header class="top-nav">
    <a href="./dashboard.html" class="brand-link">
      <span>&larr;</span>
      <span>Workspace Dashboard</span>
    </a>
    <button class="btn btn-sm btn-secondary" onclick="logout()">Sign Out</button>
  </header>

  <div class="chat-layout-wrapper">
    <div class="chat-canvas">
      <!-- Threads Sidebar -->
      <aside class="threads-sidebar">
        <div class="threads-header">
          <h2>Conversations</h2>
          <button class="btn btn-sm btn-primary" onclick="openNewMessageModal()">New</button>
        </div>
        <div class="search-box-wrap">
          <input type="text" id="searchConv" class="search-input" placeholder="Filter conversations..." onkeyup="filterConversations()">
        </div>
        <div class="threads-list" id="conversationsList"></div>
      </aside>

      <!-- Active Chat Panel -->
      <section class="conversation-panel">
        <div id="chatEmpty" class="empty-chat-view">
          <div>
            <p style="font-weight: 600; color: #64748b; margin-bottom: 0.25rem;">No active conversation</p>
            <p style="font-size: 0.85rem;">Select an alumnus from the sidebar or initiate a new message.</p>
          </div>
        </div>

        <div id="chatContent" class="chat-active-view" style="display: none;">
          <div class="chat-top-bar">
            <div class="chat-user-meta">
              <div class="chat-user-avatar" id="chatAvatar">--</div>
              <div>
                <div class="chat-user-name" id="chatPartnerName">-</div>
                <div class="chat-user-dept" id="chatPartnerDept">-</div>
              </div>
            </div>
            <button class="btn btn-sm btn-secondary" onclick="closeChat()">Close</button>
          </div>

          <div class="messages-scroll" id="messagesContainer"></div>

          <div class="message-compose-bar">
            <textarea class="compose-input" id="messageInput" placeholder="Write a message... (Press Enter to send)" rows="1"></textarea>
            <button class="btn btn-primary" onclick="sendMessage()">Send</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- New Message Modal -->
  <div id="newMessageModal" class="modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <h3 style="font-weight: 700; color: #0f172a;">Start New Conversation</h3>
        <span class="cursor-pointer" onclick="closeNewMessageModal()" style="font-size: 1.5rem; color: #94a3b8;">&times;</span>
      </div>
      <form onsubmit="startNewConversation(event)">
        <div class="form-group">
          <label>Select Recipient</label>
          <select id="selectAlumni" required>
            <option value="">Choose an alumnus...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Initial Message</label>
          <textarea id="firstMessage" rows="3" placeholder="Compose message..." required></textarea>
        </div>
        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeNewMessageModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentConversation = null;

    document.addEventListener('DOMContentLoaded', function() {
      const isLoggedIn = localStorage.getItem('isLoggedIn');
      const userEmail = localStorage.getItem('userEmail');
      const approvedAlumni = JSON.parse(localStorage.getItem('approvedAlumni')) || [];

      if(!isLoggedIn || !userEmail || !approvedAlumni.find(a => a.email.toLowerCase() === userEmail.toLowerCase())) {
        window.location.href = '../alumni/login.html';
        return;
      }

      loadConversations();
      loadAlumniOptions();
      setInterval(loadConversations, 3000);
    });

    function loadConversations() {
      const userEmail = (localStorage.getItem('userEmail') || '').toLowerCase();
      const messages = JSON.parse(localStorage.getItem('messages_' + userEmail)) || [];
      const approvedAlumni = JSON.parse(localStorage.getItem('approvedAlumni')) || [];

      const conversationMap = {};
      messages.forEach(msg => {
        const from = (msg.from || '').toLowerCase();
        const to = (msg.to || '').toLowerCase();
        const key = from === userEmail ? to : from;
        if(!conversationMap[key]) {
          conversationMap[key] = [];
        }
        conversationMap[key].push(msg);
      });

      const html = Object.entries(conversationMap).map(([email, msgs]) => {
        const partner = approvedAlumni.find(a => a.email?.toLowerCase() === email);
        const lastMsg = msgs[msgs.length - 1];
        const isActive = currentConversation === email;
        const initials = partner ? ((partner.firstName?.[0] || 'A') + (partner.lastName?.[0] || 'L')).toUpperCase() : 'AL';

        return `
          <div class="thread-item ${isActive ? 'active' : ''}" onclick="openConversation('${email}')">
            <div class="thread-avatar">${initials}</div>
            <div class="thread-info">
              <div class="thread-name">${partner ? partner.firstName + ' ' + partner.lastName : email}</div>
              <div class="thread-preview">${escapeHtml(lastMsg.text || '')}</div>
            </div>
            <div class="thread-time">${lastMsg.timestamp ? new Date(lastMsg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}</div>
          </div>
        `;
      }).join('');

      document.getElementById('conversationsList').innerHTML = html || '<div style="padding: 2rem 1.5rem; color: #94a3b8; text-align: center; font-size: 0.85rem;">No conversation threads yet</div>';
    }

    function filterConversations() {
      const search = document.getElementById('searchConv').value.toLowerCase();
      document.querySelectorAll('.thread-item').forEach(conv => {
        const text = conv.textContent.toLowerCase();
        conv.style.display = text.includes(search) ? '' : 'none';
      });
    }

    function openConversation(email) {
      currentConversation = email;
      const userEmail = (localStorage.getItem('userEmail') || '').toLowerCase();
      const approvedAlumni = JSON.parse(localStorage.getItem('approvedAlumni')) || [];
      const partner = approvedAlumni.find(a => a.email?.toLowerCase() === email);
      const messages = JSON.parse(localStorage.getItem('messages_' + userEmail)) || [];
      const conversationMsgs = messages.filter(m => (m.from?.toLowerCase() === email && m.to?.toLowerCase() === userEmail) || (m.from?.toLowerCase() === userEmail && m.to?.toLowerCase() === email));

      document.getElementById('chatEmpty').style.display = 'none';
      document.getElementById('chatContent').style.display = 'flex';

      if(partner) {
        document.getElementById('chatAvatar').textContent = ((partner.firstName?.[0] || 'A') + (partner.lastName?.[0] || 'L')).toUpperCase();
        document.getElementById('chatPartnerName').textContent = partner.firstName + ' ' + partner.lastName;
        document.getElementById('chatPartnerDept').textContent = partner.department + ' &middot; Batch ' + partner.batch;
      } else {
        document.getElementById('chatAvatar').textContent = 'AL';
        document.getElementById('chatPartnerName').textContent = email;
        document.getElementById('chatPartnerDept').textContent = 'Alumnus';
      }

      const html = conversationMsgs.map(msg => `
        <div class="msg-row ${msg.from?.toLowerCase() === userEmail ? 'sent' : 'received'}">
          <div>
            <div class="bubble">${escapeHtml(msg.text)}</div>
            <div class="msg-stamp">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
          </div>
        </div>
      `).join('');

      const container = document.getElementById('messagesContainer');
      container.innerHTML = html;
      container.scrollTop = container.scrollHeight;
      document.getElementById('messageInput').focus();

      loadConversations();
    }

    function closeChat() {
      currentConversation = null;
      document.getElementById('chatEmpty').style.display = 'flex';
      document.getElementById('chatContent').style.display = 'none';
      document.getElementById('messageInput').value = '';
      loadConversations();
    }

    function sendMessage() {
      if(!currentConversation) return;

      const text = document.getElementById('messageInput').value.trim();
      if(!text) return;

      const userEmail = (localStorage.getItem('userEmail') || '').toLowerCase();
      const messages = JSON.parse(localStorage.getItem('messages_' + userEmail)) || [];

      const newMsg = {
        from: userEmail,
        to: currentConversation,
        text: text,
        timestamp: new Date().toISOString()
      };

      messages.push(newMsg);
      localStorage.setItem('messages_' + userEmail, JSON.stringify(messages));

      const recipientMsgs = JSON.parse(localStorage.getItem('messages_' + currentConversation)) || [];
      recipientMsgs.push(newMsg);
      localStorage.setItem('messages_' + currentConversation, JSON.stringify(recipientMsgs));

      document.getElementById('messageInput').value = '';
      openConversation(currentConversation);
    }

    function loadAlumniOptions() {
      const userEmail = (localStorage.getItem('userEmail') || '').toLowerCase();
      const approvedAlumni = JSON.parse(localStorage.getItem('approvedAlumni')) || [];

      const html = approvedAlumni
        .filter(a => a.email?.toLowerCase() !== userEmail)
        .map(a => `<option value="${a.email}">${a.firstName} ${a.lastName} (${a.department || 'Alumni'})</option>`)
        .join('');

      document.getElementById('selectAlumni').innerHTML = '<option value="">Choose an alumnus...</option>' + html;
    }

    function openNewMessageModal() {
      document.getElementById('newMessageModal').classList.add('active');
    }

    function closeNewMessageModal() {
      document.getElementById('newMessageModal').classList.remove('active');
    }

    function startNewConversation(e) {
      e.preventDefault();
      const userEmail = (localStorage.getItem('userEmail') || '').toLowerCase();
      const toEmail = document.getElementById('selectAlumni').value.toLowerCase();
      const messageText = document.getElementById('firstMessage').value.trim();

      const newMsg = {
        from: userEmail,
        to: toEmail,
        text: messageText,
        timestamp: new Date().toISOString()
      };

      const messages = JSON.parse(localStorage.getItem('messages_' + userEmail)) || [];
      messages.push(newMsg);
      localStorage.setItem('messages_' + userEmail, JSON.stringify(messages));

      const recipientMsgs = JSON.parse(localStorage.getItem('messages_' + toEmail)) || [];
      recipientMsgs.push(newMsg);
      localStorage.setItem('messages_' + toEmail, JSON.stringify(recipientMsgs));

      closeNewMessageModal();
      document.getElementById('selectAlumni').value = '';
      document.getElementById('firstMessage').value = '';
      
      currentConversation = toEmail;
      openConversation(toEmail);
      loadConversations();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function logout() {
      if(confirm('Confirm sign out?')) {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('userEmail');
        window.location.href = '../alumni/login.html';
      }
    }

    document.addEventListener('keypress', (e) => {
      if(e.key === 'Enter' && !e.shiftKey && currentConversation && document.activeElement === document.getElementById('messageInput')) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
